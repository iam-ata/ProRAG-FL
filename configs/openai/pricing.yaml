# OpenAI CTI Reasoning API Pricing Reference
# Used dynamically by Phase 14 system overhead and cost calculations.
# Adheres strictly to instructions/25_SYSTEMS_BENCHMARKS.md:
# "Store pricing input/source/date in config used for cost calculation
#  rather than hardcoding an eternal price in scientific code."

version: "1.0.0"
source: "https://openai.com/api/pricing/"
effective_date: "2026-09-01"
currency: "USD"

models:
  gpt-4o-mini:
    input_per_million_tokens: 0.150
    output_per_million_tokens: 0.600
    description: "Primary fast CTI structured reasoning engine"

  gpt-4o:
    input_per_million_tokens: 2.500
    output_per_million_tokens: 10.000
    description: "High-capability fallback reasoning engine"

  text-embedding-3-small:
    input_per_million_tokens: 0.020
    output_per_million_tokens: 0.000
    description: "Dense semantic vector embedding model (1536-D)"
