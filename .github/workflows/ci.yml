name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint Check (Ruff)
        run: ruff check src tests

      - name: Format Check (Ruff)
        run: ruff format --check src tests

  test-and-audit:
    name: Unit Tests & Reproducibility Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps --no-build-isolation
          pip install pytest hypothesis flwr torch scikit-learn pandas numpy scipy pydantic pyyaml typer structlog transformers qdrant-client minio

      - name: Run Full Unit Regression Test Suite
        run: pytest tests/unit -v

      - name: Run Master Reproducibility Audit
        run: python -m prorag_fl.cli.main audit full

      - name: Upload Reproducibility Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-audit-reports
          path: reports/audit/
